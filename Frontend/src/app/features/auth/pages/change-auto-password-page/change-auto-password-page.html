<app-auth-layout>
  <form class="inaya-login-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h4 class="inaya-title">
      {{ 'firstLogin.title' | translate }}
    </h4>

    <p class="text-center text-sm text-gray-500 mb-4">
      {{ 'firstLogin.description' | translate }}
    </p>

    <div class="mb-3 inaya-password-wrapper">
      <app-password-input formControlName="oldPassword" placeholder="firstLogin.oldPassword" />
      <app-form-error
        [show]="form.controls.oldPassword.touched && form.controls.oldPassword.hasError('required')"
        messageKey="validation.passwordRequired"
      />
    </div>

    <div class="mb-3 inaya-password-wrapper">
      <app-password-input formControlName="newPassword" placeholder="firstLogin.newPassword" />
      <app-form-error
        [show]="form.controls.newPassword.touched && form.controls.newPassword.hasError('required')"
        messageKey="validation.passwordRequired"
      />
      <app-form-error
        [show]="form.controls.newPassword.touched && form.controls.newPassword.hasError('minlength')"
        messageKey="validation.passwordMinLength"
      />
      <app-form-error
        [show]="form.controls.newPassword.touched && form.controls.newPassword.hasError('missingUppercase')"
        messageKey="validation.passwordUppercase"
      />
      <app-form-error
        [show]="form.controls.newPassword.touched && form.controls.newPassword.hasError('missingLowercase')"
        messageKey="validation.passwordLowercase"
      />
      <app-form-error
        [show]="form.controls.newPassword.touched && form.controls.newPassword.hasError('missingDigit')"
        messageKey="validation.passwordDigit"
      />
      <app-form-error
        [show]="form.controls.newPassword.touched && form.controls.newPassword.hasError('missingSymbol')"
        messageKey="validation.passwordSymbol"
      />
    </div>

    <div class="mb-3 inaya-password-wrapper">
      <app-password-input formControlName="confirmPassword" placeholder="firstLogin.confirmPassword" />
      <app-form-error
        [show]="form.controls.confirmPassword.touched && form.controls.confirmPassword.hasError('required')"
        messageKey="validation.passwordRequired"
      />
      <app-form-error
        [show]="form.controls.confirmPassword.touched && form.hasError('passwordMismatch')"
        messageKey="validation.passwordMismatch"
      />
    </div>

    @if (serverError()) {
      <p class="text-center text-red-500 text-sm mb-3">{{ serverError() }}</p>
    }

    <button
      type="submit"
      class="inaya-btn"
      [disabled]="form.invalid || loading()"
    >
      @if (loading()) {
        {{ 'common.loading' | translate }}
      } @else {
        {{ 'firstLogin.submit' | translate }}
      }
    </button>
  </form>
</app-auth-layout>
