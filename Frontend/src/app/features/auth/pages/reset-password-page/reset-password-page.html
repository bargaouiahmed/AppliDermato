<app-auth-layout>
  @switch (step()) {
    @case ('email') {
      <app-reset-email-step
        #emailStepRef
        (emailSubmit)="onEmailSubmit($event)"
        (backToLogin)="goToLogin()"
      />
    }
    @case ('code') {
      <app-reset-code-step
        #codeStepRef
        (codeSubmit)="onCodeSubmit($event)"
        (resendCode)="onResendCode()"
        (back)="goBackToEmail()"
      />
    }
    @case ('password') {
      <app-reset-password-step
        #passwordStepRef
        (passwordSubmit)="onPasswordSubmit($event)"
        (back)="goBackToCode()"
      />
    }
    @case ('success') {
      <div class="text-center">
        <!-- Checkmark icon -->
        <div class="flex justify-center mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-[#175042]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <h4 class="text-lg font-bold text-[#175042] mb-2">
          {{ 'reset.passwordStep.success' | translate }}
        </h4>
        <button
          type="button"
          class="mt-4 rounded bg-[#175042] px-6 py-2 text-sm font-bold uppercase text-white transition hover:bg-[#123d33] cursor-pointer"
          (click)="goToLogin()"
        >
          {{ 'reset.backToLogin' | translate }}
        </button>
      </div>
    }
  }
</app-auth-layout>
