<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <h4 class="text-center text-lg font-bold uppercase mb-2 text-gray-800">
    {{ 'reset.passwordStep.title' | translate }}
  </h4>

  <p class="text-center text-sm text-gray-500 mb-4">
    {{ 'reset.passwordStep.description' | translate }}
  </p>

  <!-- New password -->
  <div class="mb-3">
    <app-password-input formControlName="password" placeholder="reset.passwordStep.newPassword" />
    <app-form-error
      [show]="form.controls.password.touched && form.controls.password.hasError('required')"
      messageKey="validation.passwordRequired"
    />
    <app-form-error
      [show]="form.controls.password.touched && form.controls.password.hasError('minlength')"
      messageKey="validation.passwordMinLength"
    />
    <app-form-error
      [show]="form.controls.password.touched && form.controls.password.hasError('missingUppercase')"
      messageKey="validation.passwordUppercase"
    />
    <app-form-error
      [show]="form.controls.password.touched && form.controls.password.hasError('missingLowercase')"
      messageKey="validation.passwordLowercase"
    />
    <app-form-error
      [show]="form.controls.password.touched && form.controls.password.hasError('missingDigit')"
      messageKey="validation.passwordDigit"
    />
    <app-form-error
      [show]="form.controls.password.touched && form.controls.password.hasError('missingSymbol')"
      messageKey="validation.passwordSymbol"
    />
  </div>

  <!-- Confirm password -->
  <div class="mb-3">
    <app-password-input formControlName="confirmPassword" placeholder="reset.passwordStep.confirmPassword" />
    <app-form-error
      [show]="form.controls.confirmPassword.touched && form.controls.confirmPassword.hasError('required')"
      messageKey="validation.passwordRequired"
    />
    <app-form-error
      [show]="form.controls.confirmPassword.touched && form.hasError('passwordMismatch')"
      messageKey="validation.passwordMismatch"
    />
  </div>

  @if (serverError()) {
    <p class="text-center text-red-500 text-sm mb-3">{{ serverError() }}</p>
  }

  <button
    type="submit"
    class="w-full rounded bg-[#175042] py-2 text-sm font-bold uppercase text-white transition hover:bg-[#123d33] disabled:opacity-60 disabled:cursor-not-allowed"
    [disabled]="form.invalid || loading()"
  >
    @if (loading()) {
      {{ 'common.loading' | translate }}
    } @else {
      {{ 'reset.passwordStep.submit' | translate }}
    }
  </button>

  <div class="text-center mt-3">
    <a
      class="text-sm text-[#175042] underline cursor-pointer hover:text-[#123d33]"
      (click)="back.emit()"
    >
      {{ 'common.back' | translate }}
    </a>
  </div>
</form>
