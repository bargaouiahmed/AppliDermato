<div
  class="card bg-camel shadow-sm p-3 my-3 antecedent-section-wrapper"
  [attr.dir]="dir"
  [class.section-expanded]="!isSectionCollapsible || histoireMaladieExpanded"
  [class.rtl-layout]="isRtl"
  (mouseenter)="onWrapperEnter()"
  (mouseleave)="onWrapperLeave()"
>
  <div
    class="card-header border-bottom-0 d-flex justify-content-between align-items-center"
    [class.non-collapsible]="!isSectionCollapsible"
    (click)="toggleHistoireMaladie($event)"
  >
    <h3 class="mb-0">{{ 'consultation.page.interrogatoire.histoireMaladie.title' | translate }}</h3>
    <i *ngIf="isSectionCollapsible" class="bi bi-chevron-down collapse-indicator"></i>
  </div>

  <div class="antecedent-collapsible-body">
    <div class="mb-2">
      <textarea
        class="form-control histoire-maladie-textarea"
        [ngModel]="histoireMaladie"
        (ngModelChange)="onValueChange($event)"
        [placeholder]="'consultation.page.interrogatoire.histoireMaladie.placeholder' | translate"
        rows="6"
        (mousedown)="$event.stopPropagation()"
      ></textarea>
    </div>
  </div>
</div>
